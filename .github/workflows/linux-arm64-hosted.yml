name: linux-arm64-hosted

# Router and relay for 64-bit ARM Linux (Raspberry Pi and similar) on a stock
# GitHub-hosted arm64 runner. The GUI client and host need the same kind of
# desktop development packages as the x64 build and are left to the self-hosted
# rpios12 job in linux.yml.

on:
  workflow_dispatch:

concurrency:
  group: linux-arm64-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/builds/ci/vcpkg_installed
  VCPKG_BINARY_SOURCES: 'default,readwrite'
  # The arm64 runner has 4 cores and 16 GB of RAM. Qt's translation units need
  # 2-3 GB each, so building with full parallelism is a reliable way to get the
  # compiler OOM-killed in the middle of the one-hour Qt build.
  VCPKG_MAX_CONCURRENCY: 2

jobs:
  build:
    name: arm64-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      # Qt is built from source here (there are no arm64-linux Qt binaries in the
      # vcpkg cache), and a full build does not fit into the ~14 GB of free space
      # of a stock arm64 runner. Drop the preinstalled toolchains the build does
      # not use before vcpkg starts writing buildtrees.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      # Even with the limits above a couple of Qt files are close to the RAM
      # size, so give the compiler some room to page out instead of dying.
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            autoconf autoconf-archive automake libtool m4 gettext gperf \
            libssl-dev zlib1g-dev
          sudo apt-get install -y '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev \
            libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libx11-dev libxext-dev

      # Restore and save are split on purpose: actions/cache only writes the cache
      # when the whole job succeeds, but this job has to build Qt from scratch and
      # used to fail long before that. Saving on failure keeps the ports that were
      # built successfully, so every next run starts closer to the end.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-linux-${{ hashFiles('vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            vcpkg-arm64-linux-${{ hashFiles('vcpkg.json') }}-
            vcpkg-arm64-linux-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -x vcpkg4aspia/vcpkg ]; then
            ./vcpkg4aspia/bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg4aspia/vcpkg version

      - name: Configure
        env:
          VCPKG_TRIPLET: arm64-linux
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-linux
        # --clean-after-build removes the packages/ and buildtrees/ of every port
        # once it is installed; the runner simply does not have the disk for both
        # the build trees and the installed Qt.
        run: cmake --preset ci -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build router and relay
        env:
          VCPKG_TRIPLET: arm64-linux
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-linux
        run: cmake --build --preset ci-release --parallel --target aspia_router aspia_relay

      - name: Package
        run: |
          mkdir -p artifacts
          installer/linux/build_packages.sh \
            --build-dir "${{ github.workspace }}/builds/ci/Release" \
            --output-dir artifacts \
            --component router --component relay \
            --format deb --format rpm

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: aspia-linux-arm64
          path: artifacts/*
          if-no-files-found: error

      - name: Save vcpkg binary cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-linux-${{ hashFiles('vcpkg.json') }}-${{ github.sha }}
