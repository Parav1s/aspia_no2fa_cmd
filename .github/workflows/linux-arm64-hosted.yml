name: linux-arm64-hosted

# Router and relay for 64-bit ARM Linux (Raspberry Pi and similar) on a stock
# GitHub-hosted arm64 runner. The GUI client and host need the same kind of
# desktop development packages as the x64 build and are left to the self-hosted
# rpios12 job in linux.yml.

on:
  workflow_dispatch:

concurrency:
  group: linux-arm64-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/builds/ci/vcpkg_installed
  VCPKG_BINARY_SOURCES: 'default,readwrite'

jobs:
  build:
    name: arm64-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            autoconf autoconf-archive automake libtool m4 gettext \
            libssl-dev zlib1g-dev

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-linux-${{ hashFiles('vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            vcpkg-arm64-linux-${{ hashFiles('vcpkg.json') }}-
            vcpkg-arm64-linux-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -x vcpkg4aspia/vcpkg ]; then
            ./vcpkg4aspia/bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg4aspia/vcpkg version

      - name: Configure
        env:
          VCPKG_TRIPLET: arm64-linux
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-linux
        run: cmake --preset ci

      - name: Build router and relay
        env:
          VCPKG_TRIPLET: arm64-linux
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-linux
        run: cmake --build --preset ci-release --parallel --target aspia_router aspia_relay

      - name: Package
        run: |
          mkdir -p artifacts
          installer/linux/build_packages.sh \
            --build-dir "${{ github.workspace }}/builds/ci/Release" \
            --output-dir artifacts \
            --component router --component relay \
            --format deb --format rpm

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: aspia-linux-arm64
          path: artifacts/*
          if-no-files-found: error
